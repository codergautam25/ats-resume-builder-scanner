version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ats-resume-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Inject your Gemini API key here OR use a .env file (see .env.example)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_URL=${APP_URL:-http://localhost:3000}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      # Optional: mount an uploads directory for persistent PDF storage
      - uploads:/app/uploads
    labels:
      - "com.ats-resume-ai.description=ATS Resume Builder & AI Scanner"
      - "com.ats-resume-ai.version=1.0.0"

volumes:
  uploads:
    driver: local
